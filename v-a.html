<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Geo Pros Championship</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f8f8; --ink:#0f1419; --ink2:#6b7280; --ink3:#9ca3af;
    --line:#e5e7eb; --line2:#f1f2f3;
    --p1:#2563eb; --p2:#059669; --p3:#ea580c;
    --up:#059669; --down:#dc2626;
    --r:'Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif;
    --m:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px;
    border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:9px}
  .ball{width:28px;height:28px;border-radius:50%;flex:0 0 28px;
    background:
      radial-gradient(circle at 32% 30%,#4ade80 0 22%,transparent 23%),
      radial-gradient(circle at 70% 62%,#38bdf8 0 24%,transparent 25%),
      conic-gradient(from 20deg,#fbbf24,#fb923c,#34d399,#60a5fa,#fbbf24);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.18)}
  .brand b{font-size:13.5px;font-weight:800;letter-spacing:.4px}
  .brand small{display:block;font-size:9px;letter-spacing:2.2px;color:var(--ink3);
    text-transform:uppercase;font-weight:700;margin-top:1px}
  .mes{text-align:right;font-size:11px;color:var(--ink2);font-family:var(--m);line-height:1.5}
  .mes b{display:block;color:var(--ink);font-size:12.5px;font-weight:800}

  /* ---------- podio ---------- */
  .podio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;
    padding:26px 0 0;margin-bottom:6px}
  .col{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bar{width:100%;border-radius:9px 9px 0 0;position:relative;
    display:flex;align-items:flex-start;justify-content:center;padding-top:9px;
    background:linear-gradient(175deg,var(--c),color-mix(in srgb,var(--c) 62%,#fff));
    box-shadow:0 -1px 0 rgba(0,0,0,.05)}
  .bar span{font-family:var(--m);font-size:13px;font-weight:800;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.22)}
  .col .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:900;color:#fff;background:var(--c)}
  .col .nm{font-size:12.5px;font-weight:800;letter-spacing:-.2px;text-align:center}
  .col .pt{font-family:var(--m);font-size:10.5px;color:var(--ink2)}
  .medal{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:#fff;border:1.5px solid var(--c);color:var(--c);font-size:9px;font-weight:900;
    width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  /* ---------- kpis ---------- */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0 0}
  .kpi{padding:14px 12px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
  .kpi:nth-child(2n){border-right:none}
  .kpi .kl{font-size:8.5px;letter-spacing:1.3px;color:var(--ink3);text-transform:uppercase;font-weight:800}
  .kpi .kv{font-family:var(--m);font-size:20px;font-weight:800;margin-top:5px;letter-spacing:-.6px}
  .kpi .ks{font-size:10px;color:var(--ink2);margin-top:2px}

  /* ---------- secciones ---------- */
  .sec{margin-top:26px}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:14px}
  .sechead h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;
    font-weight:900;margin:0}
  .sechead span{font-size:10.5px;color:var(--ink2);font-family:var(--m)}

  /* ---------- tabla clasificacion ---------- */
  .clas{width:100%;border-collapse:collapse;font-family:var(--m);font-size:12px}
  .clas th{font-size:8.5px;letter-spacing:.7px;color:var(--ink3);text-transform:uppercase;
    font-weight:800;text-align:right;padding:0 7px 8px;border-bottom:1px solid var(--line)}
  .clas th:first-child{text-align:left;padding-left:0}
  .clas td{padding:11px 7px;text-align:right;border-bottom:1px solid var(--line2)}
  .clas td:first-child{text-align:left;padding-left:0}
  .clas tr:last-child td{border-bottom:none}
  .pos{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;
    border-radius:6px;background:var(--bg2);font-size:11px;font-weight:800;color:var(--ink2)}
  .pos.g{background:var(--ink);color:#fff}
  .who{display:flex;align-items:center;gap:8px;font-family:-apple-system,sans-serif}
  .who i{width:9px;height:9px;border-radius:3px;background:var(--c);display:block}
  .who b{font-size:13px;font-weight:800}
  .big{font-size:14px;font-weight:800;letter-spacing:-.4px}
  .dlt{color:var(--down);font-size:11px}
  .dlt.z{color:var(--ink3)}

  /* ---------- grafica ---------- */
  .card{border:1px solid var(--line);border-radius:14px;padding:16px 12px 10px;background:#fff}
  .card svg{display:block;width:100%;height:auto;overflow:visible}
  .lg{display:flex;gap:16px;justify-content:center;padding:6px 0 2px;flex-wrap:wrap}
  .lg div{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);font-family:var(--m)}
  .lg i{width:11px;height:3px;border-radius:2px;background:var(--c);display:block}

  /* ---------- semanas ---------- */
  .wk{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px}
  .wkh{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
    background:var(--bg2);border-bottom:1px solid var(--line)}
  .wkh b{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:900}
  .wkh span{font-family:var(--m);font-size:10px;color:var(--ink2)}
  .ts{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .wk table{width:100%;border-collapse:collapse;font-family:var(--m);font-size:11.5px}
  .wk th{font-size:8px;letter-spacing:.5px;color:var(--ink3);text-transform:uppercase;
    font-weight:800;padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  .wk td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
  .wk tr:last-child td{border-bottom:none}
  .wk td.nm{text-align:left;padding-left:14px;font-family:-apple-system,sans-serif;
    font-weight:800;font-size:12px}
  .wk td.miss{color:#d1d5db}
  .wk td.tot{font-weight:800}
  .wkfoot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg2)}
  .wkfoot div{padding:9px;border-right:1px solid var(--line);text-align:center}
  .wkfoot div:last-child{border-right:none}
  .wkfoot b{display:block;font-family:var(--m);font-size:13px;font-weight:800}
  .wkfoot span{font-size:7.5px;letter-spacing:.9px;color:var(--ink3);text-transform:uppercase;font-weight:800}

  /* ---------- form ---------- */
  .form{border:1px solid var(--line);border-radius:14px;padding:16px}
  .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .fr.one{grid-template-columns:1fr}
  label{display:block;font-size:8.5px;letter-spacing:1.2px;color:var(--ink3);
    text-transform:uppercase;font-weight:800;margin-bottom:6px}
  input,select{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:var(--m);font-size:15px;padding:12px;outline:none;
    appearance:none;-webkit-appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),
    linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
    background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input:focus,select:focus{border-color:var(--ink)}
  .btn{width:100%;border:none;border-radius:11px;padding:15px;font-size:14px;font-weight:800;
    font-family:inherit;color:#fff;background:var(--ink);margin-top:3px}
  .btn:active{opacity:.85}
  .btn.gh{background:#fff;border:1.5px solid var(--line);color:var(--ink2);margin-top:9px}

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);
    transform:translate(-50%,-170%);opacity:0;visibility:hidden;pointer-events:none;
    background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:12px 20px;
    border-radius:11px;z-index:60;max-width:88vw;text-align:center;
    transition:transform .26s,opacity .26s,visibility .26s;box-shadow:0 8px 24px rgba(0,0,0,.20)}
  #toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}

  .foot{padding:26px 0 10px;text-align:center;color:var(--ink3);font-size:10px;
    font-family:var(--m);line-height:1.9}
  .sync{display:flex;align-items:center;justify-content:center;gap:7px;
    padding:11px;font-family:var(--m);font-size:10.5px;color:var(--ink2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pl 2s infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
  @media(min-width:600px){ .kpis{grid-template-columns:repeat(4,1fr)} .kpi{border-right:1px solid var(--line2)} .kpi:nth-child(2n){border-right:1px solid var(--line2)} .kpi:last-child{border-right:none} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="ball"></div>
    <div><b>GEO PROS</b><small>Championship</small></div>
  </div>
  <div class="mes"><b id="monthLbl">—</b><span id="daysTxt">—</span></div>
</div>

<div class="wrap">

  <div class="podio" id="podio"></div>

  <div class="kpis" id="kpis"></div>

  <div class="sec">
    <div class="sechead"><h2>Clasificación</h2><span id="leadTxt">—</span></div>
    <table class="clas">
      <thead><tr>
        <th>#</th><th style="text-align:left">Jugador</th><th>Días</th><th>Total</th><th>Prom.</th><th>Dif.</th>
      </tr></thead>
      <tbody id="clasBody"></tbody>
    </table>
  </div>

  <div class="sec">
    <div class="sechead"><h2>Evolución</h2><span>acumulado</span></div>
    <div class="card">
      <svg id="chart" viewBox="0 0 620 210" preserveAspectRatio="none" role="img" aria-label="Evolución"></svg>
      <div class="lg" id="legend"></div>
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><h2>Semana a semana</h2><span id="wkCount">—</span></div>
    <div id="weeks"></div>
  </div>

  <div class="sec">
    <div class="sechead"><h2>Anotar puntaje</h2><span id="syncTxt">conectando…</span></div>
    <div class="form">
      <div class="fr">
        <div><label>Jugador</label><select id="fPlayer"></select></div>
        <div><label>Fecha</label><input id="fDate" type="date"></div>
      </div>
      <div class="fr one">
        <div><label>Puntos (máx. 25.000)</label>
          <input id="fScore" type="text" inputmode="numeric" placeholder="19742" autocomplete="off"></div>
      </div>
      <button class="btn" id="saveBtn">Guardar puntaje</button>
      <button class="btn gh" id="delBtn">Borrar ese día</button>
    </div>
  </div>

  <div class="sync"><i class="dot"></i><span id="updTxt">—</span></div>
  <div class="foot">Geo Pros Championship · Pame · Ari · Gerry<br>Datos sincronizados en la nube</div>
</div>

<div id="toast"></div>

<script>
/* ===== CONFIG ===== */
const RTDB  = 'https://plan-gym-8aff7-default-rtdb.firebaseio.com';
const CLOUD = 'geopros';
const LSKEY = 'geoProsV1';
const MES_INICIO = '2026-09-02';
const MES_FIN    = '2026-09-30';

const PLAYERS = [
  { id:'pame',  nombre:'Pame',  ini:'PA', color:'#2563eb' },
  { id:'ari',   nombre:'Ari',   ini:'AR', color:'#059669' },
  { id:'gerry', nombre:'Gerry', ini:'GE', color:'#ea580c' }
];

const SEED = {
  '2026-09-02': { pame:19026, ari:21110, gerry:22362 },
  '2026-09-03': { pame:14598, ari:13854, gerry: 9358 },
  '2026-09-04': { pame:19670, ari:17994, gerry:19336 },
  '2026-09-05': { pame:23665, ari:19551, gerry:19433 },
  '2026-09-06': { pame:17686, ari:19819, gerry:17170 },
  '2026-09-07': { pame:18296, ari:20459, gerry:17900 },
  '2026-09-08': { pame:14526, ari:14537, gerry:10766 },
  '2026-09-09': { pame:22602, ari:21473, gerry:22043 }
};

const DAYS_ES = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];

const $ = id => document.getElementById(id);
const fmt = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US');
const iso = d => d.toISOString().slice(0,10);
const parseISO = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
function isoWeekKey(dateStr){
  const d = parseISO(dateStr);
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return iso(d);
}
function showToast(msg, ok){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = ok === false ? '#dc2626' : '#0f1419';
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('on'), 3200);
}
function horaAhora(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ===== ESTADO / NUBE ===== */
let DATA = {};
function seedIfEmpty(remote){
  if (remote && Object.keys(remote).length) return remote;
  let seeded = '';
  try { seeded = localStorage.getItem(LSKEY + '_seeded') || ''; } catch(e){}
  if (seeded === '1') return remote || {};
  try { localStorage.setItem(LSKEY + '_seeded','1'); } catch(e){}
  saveRemote(SEED);
  return JSON.parse(JSON.stringify(SEED));
}
let saveTimer = null;
function saveRemote(obj){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch(RTDB + '/' + CLOUD + '/scores.json', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(obj)
    })
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); })
    .then(() => { $('syncTxt').textContent = 'guardado ' + horaAhora(); $('updTxt').textContent = 'sincronizado ' + horaAhora(); })
    .catch(() => { $('syncTxt').textContent = 'sin conexión (local)'; });
  }, 600);
}
function loadCloud(){
  $('syncTxt').textContent = 'conectando…';
  fetch(RTDB + '/' + CLOUD + '/scores.json')
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(remote => {
      DATA = seedIfEmpty(remote) || {};
      $('syncTxt').textContent = 'en vivo';
      $('updTxt').textContent = 'sincronizado ' + horaAhora();
      renderAll();
    })
    .catch(() => {
      let local = null;
      try { local = JSON.parse(localStorage.getItem(LSKEY) || 'null'); } catch(e){}
      DATA = local || JSON.parse(JSON.stringify(SEED));
      $('syncTxt').textContent = 'modo local';
      renderAll();
    });
}

/* ===== CALCULOS ===== */
function fechasDelMes(){
  const out = [], d = parseISO(MES_INICIO), fin = parseISO(MES_FIN);
  while (d <= fin){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
const totalJugador = (pid, fs) => fs.reduce((s,f) => s + ((DATA[f] && DATA[f][pid]) || 0), 0);
const jugadosJugador = (pid, fs) => fs.filter(f => DATA[f] && DATA[f][pid]).length;
function mejorJugador(pid, fs){
  let b = 0;
  fs.forEach(f => { const v = DATA[f] && DATA[f][pid]; if (v > b) b = v; });
  return b || null;
}
function promedioJugador(pid, fs){
  const n = jugadosJugador(pid, fs);
  return n ? totalJugador(pid, fs) / n : null;
}
function rachaMax(pid, fs){
  const j = fs.filter(f => DATA[f] && DATA[f][pid]);
  if (!j.length) return 0;
  let best = 1, cur = 1;
  for (let i=1;i<j.length;i++){
    const diff = Math.round((parseISO(j[i]) - parseISO(j[i-1])) / 86400000);
    cur = diff === 1 ? cur + 1 : 1;
    if (cur > best) best = cur;
  }
  return best;
}
function ranking(fs){
  return PLAYERS.map(p => ({
    ...p,
    total: totalJugador(p.id, fs),
    dias:  jugadosJugador(p.id, fs),
    mejor: mejorJugador(p.id, fs),
    prom:  promedioJugador(p.id, fs),
    racha: rachaMax(p.id, fs)
  })).sort((a,b) => b.total - a.total);
}

/* ===== RENDER ===== */
function renderAll(){
  const fs = fechasDelMes();
  const rk = ranking(fs);
  const lider = rk[0] ? rk[0].total : 0;
  const ini = parseISO(MES_INICIO);
  const mesTxt = MESES[ini.getMonth()].charAt(0).toUpperCase() + MESES[ini.getMonth()].slice(1);

  $('monthLbl').textContent = mesTxt + ' ' + ini.getFullYear();
  const conDatos = fs.filter(f => DATA[f] && Object.keys(DATA[f]).length).length;
  $('daysTxt').textContent = conDatos + ' de ' + fs.length + ' días';
  $('leadTxt').textContent = rk[0] ? rk[0].nombre + ' +' + fmt(lider - rk[1].total) : '—';

  renderPodio(rk, lider);
  renderKpis(rk, fs);
  renderClas(rk, lider);
  renderChart(fs);
  renderWeeks(fs);
  renderPlayerSelect();
}

function renderPodio(rk, lider){
  const orden = [rk[1], rk[0], rk[2]].filter(Boolean);   // 2º, 1º, 3º
  const max = lider || 1;
  const alturas = { 0: 120, 1: 88, 2: 66 };
  const puesto = { 0: 1, 1: 2, 2: 3 };
  let html = '';
  orden.forEach((p) => {
    const idx = rk.indexOf(p);
    const h = Math.max(46, alturas[idx]);
    html += '<div class="col" style="--c:' + p.color + '">' +
      '<div class="bar" style="height:' + h + 'px">' +
        '<div class="medal">' + puesto[idx] + '</div>' +
        '<span>' + fmt(p.total) + '</span>' +
      '</div>' +
      '<div class="av">' + p.ini + '</div>' +
      '<div class="nm">' + p.nombre + '</div>' +
      '<div class="pt">' + p.dias + ' días</div>' +
    '</div>';
  });
  $('podio').innerHTML = html;
}

function renderKpis(rk, fs){
  let mejor = 0, quien = '—', fecha = '';
  const porDia = {};
  fs.forEach(f => {
    if (!DATA[f]) return;
    porDia[f] = Object.keys(DATA[f]).reduce((s,k) => s + (DATA[f][k]||0), 0);
    PLAYERS.forEach(p => {
      const v = DATA[f][p.id];
      if (v && v > mejor){ mejor = v; quien = p.nombre; fecha = f; }
    });
  });
  const n = Object.keys(porDia).length || 1;
  const prom = Object.values(porDia).reduce((s,v)=>s+v,0) / n;
  const racha = Math.max.apply(null, rk.map(p => p.racha).concat([0]));
  const lider = rk[0] ? rk[0].total : 0;

  const k = (l,v,s,c) => '<div class="kpi"><div class="kl">' + l + '</div>' +
    '<div class="kv"' + (c?' style="color:'+c+'"':'') + '>' + v + '</div>' +
    '<div class="ks">' + s + '</div></div>';

  $('kpis').innerHTML =
    k('Líder', fmt(lider), rk[0] ? rk[0].nombre : '—', rk[0] ? rk[0].color : '') +
    k('Mejor día', fmt(mejor || null), quien + (fecha ? ' · ' + fmtFechaCorta(fecha) : '')) +
    k('Promedio', fmt(prom), 'por día, los 3') +
    k('Mejor racha', racha + ' d', 'días seguidos');
}

function fmtFechaCorta(f){
  const d = parseISO(f);
  return d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3);
}

function renderClas(rk, lider){
  $('clasBody').innerHTML = rk.map((p,i) => {
    const d = i === 0 ? '—' : '−' + fmt(lider - p.total);
    return '<tr style="--c:' + p.color + '">' +
      '<td><span class="pos' + (i===0?' g':'') + '">' + (i+1) + '</span></td>' +
      '<td><div class="who"><i></i><b>' + p.nombre + '</b></div></td>' +
      '<td>' + p.dias + '</td>' +
      '<td class="big" style="color:' + p.color + '">' + fmt(p.total) + '</td>' +
      '<td>' + fmt(p.prom) + '</td>' +
      '<td class="dlt' + (i===0?' z':'') + '">' + d + '</td>' +
    '</tr>';
  }).join('');
}

function renderChart(fs){
  const svg = $('chart');
  const W = 620, H = 210, PL = 44, PR = 12, PT = 12, PB = 24;
  const act = fs.filter(f => DATA[f] && Object.keys(DATA[f]).length);
  if (act.length < 2){
    svg.innerHTML = '<text x="310" y="105" fill="#9ca3af" font-size="12" text-anchor="middle" ' +
      'font-family="monospace">Faltan días para dibujar la evolución</text>';
    $('legend').innerHTML = '';
    return;
  }
  const series = {}, run = {};
  PLAYERS.forEach(p => { series[p.id] = []; run[p.id] = 0; });
  act.forEach(f => PLAYERS.forEach(p => {
    run[p.id] += (DATA[f] && DATA[f][p.id]) || 0;
    series[p.id].push(run[p.id]);
  }));
  const maxV = Math.max.apply(null, PLAYERS.map(p => series[p.id][series[p.id].length-1]).concat([1]));
  const stepX = (W - PL - PR) / Math.max(1, act.length - 1);
  const yOf = v => PT + (H - PT - PB) * (1 - v / (maxV * 1.08));
  const xOf = i => PL + stepX * i;

  let g = '';
  for (let i=0;i<=4;i++){
    const y = yOf(maxV * 1.08 * i/4);
    g += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+
         '" stroke="#eef0f1" stroke-width="1"/>' +
         '<text x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#9ca3af" font-size="9" ' +
         'text-anchor="end" font-family="monospace">'+Math.round(maxV*1.08*i/4/1000)+'k</text>';
  }
  act.forEach((f,i) => {
    if (act.length > 8 && i % 2) return;
    g += '<text x="'+xOf(i).toFixed(1)+'" y="'+(H-6)+'" fill="#9ca3af" font-size="8.5" ' +
         'text-anchor="middle" font-family="monospace">'+parseISO(f).getDate()+'</text>';
  });
  PLAYERS.forEach(p => {
    const pts = series[p.id].map((v,i) => xOf(i).toFixed(1)+','+yOf(v).toFixed(1)).join(' ');
    g += '<polyline points="'+pts+'" fill="none" stroke="'+p.color+
         '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    const li = series[p.id].length - 1;
    g += '<circle cx="'+xOf(li).toFixed(1)+'" cy="'+yOf(series[p.id][li]).toFixed(1)+
         '" r="4.5" fill="#fff" stroke="'+p.color+'" stroke-width="2.6"/>';
  });
  svg.innerHTML = g;
  $('legend').innerHTML = PLAYERS.map(p =>
    '<div style="--c:'+p.color+'"><i></i>'+p.nombre+'</div>').join('');
}

function renderWeeks(fs){
  const groups = {};
  fs.forEach(f => {
    const k = isoWeekKey(f);
    (groups[k] = groups[k] || []).push(f);
  });
  const keys = Object.keys(groups).sort();
  $('wkCount').textContent = keys.length + ' semanas';

  $('weeks').innerHTML = keys.map((k, wi) => {
    const dias = groups[k];
    const cols = dias.map(f => {
      const d = parseISO(f);
      return { f:f, lbl: DAYS_ES[(d.getDay()+6)%7], n:d.getDate() };
    });
    const th = '<tr><th style="text-align:left;padding-left:14px">Sem ' + (wi+1) + '</th>' +
      cols.map(c => '<th>' + c.lbl + ' ' + c.n + '</th>').join('') +
      '<th>Total</th><th>#</th></tr>';

    const tot = PLAYERS.map(p => {
      let t = 0;
      dias.forEach(f => { const v = DATA[f] && DATA[f][p.id]; if (v) t += v; });
      return { p, total:t };
    }).sort((a,b) => b.total - a.total);

    const rows = tot.map((t, i) => {
      const tds = cols.map(c => {
        const v = DATA[c.f] && DATA[c.f][t.p.id];
        return v ? '<td>' + fmt(v) + '</td>' : '<td class="miss">·</td>';
      }).join('');
      return '<tr><td class="nm" style="color:' + t.p.color + '">' + t.p.nombre + '</td>' +
        tds + '<td class="tot">' + fmt(t.total) + '</td>' +
        '<td' + (i===0 ? ' style="font-weight:800"' : '') + '>' + (i+1) + '</td></tr>';
    }).join('');

    const jug = dias.filter(f => DATA[f] && Object.keys(DATA[f]).length).length;

    return '<div class="wk"><div class="wkh"><b>Semana ' + (wi+1) + '</b><span>' +
      fmtFechaCorta(dias[0]) + ' – ' + fmtFechaCorta(dias[dias.length-1]) + '</span></div>' +
      '<div class="ts"><table><thead>' + th + '</thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="wkfoot">' +
        '<div><b>' + jug + '/' + dias.length + '</b><span>días</span></div>' +
        '<div><b style="color:' + tot[0].p.color + '">' + tot[0].p.nombre + '</b><span>gana</span></div>' +
        '<div><b>' + fmt(tot.reduce((s,x)=>s+x.total,0)) + '</b><span>puntos</span></div>' +
      '</div></div>';
  }).join('');
}

function renderPlayerSelect(){
  const sel = $('fPlayer');
  if (sel.options.length) return;
  sel.innerHTML = PLAYERS.map(p => '<option value="' + p.id + '">' + p.nombre + '</option>').join('');
  $('fDate').value = iso(new Date());
}

/* ===== ACCIONES ===== */
function commit(){
  try { localStorage.setItem(LSKEY, JSON.stringify(DATA)); } catch(e){}
  saveRemote(DATA);
  renderAll();
}
$('saveBtn').onclick = () => {
  const pid = $('fPlayer').value, f = $('fDate').value;
  const raw = $('fScore').value.replace(/[^0-9]/g,''), v = parseInt(raw, 10);
  if (!f) return showToast('Falta la fecha', false);
  if (!raw || isNaN(v)) return showToast('Escribe los puntos', false);
  if (v < 0 || v > 25000) return showToast('Los puntos van de 0 a 25.000', false);
  if (!DATA[f]) DATA[f] = {};
  const antes = DATA[f][pid];
  DATA[f][pid] = v;
  commit();
  const p = PLAYERS.find(x => x.id === pid);
  if (antes && v > antes) showToast(p.nombre + ': ¡' + fmt(v) + '! (+' + fmt(v-antes) + ')');
  else showToast(p.nombre + ' · ' + fmt(v) + ' guardado');
  $('fScore').value = '';
};
$('delBtn').onclick = () => {
  const pid = $('fPlayer').value, f = $('fDate').value;
  if (!f || !DATA[f] || !DATA[f][pid]) return showToast('No hay puntaje ese día', false);
  delete DATA[f][pid];
  if (!Object.keys(DATA[f]).length) delete DATA[f];
  commit();
  showToast('Borrado');
};
$('fDate').addEventListener('change', () => {
  const v = DATA[$('fDate').value] && DATA[$('fDate').value][$('fPlayer').value];
  $('fScore').value = v ? String(v) : '';
});

/* ===== ARRANQUE ===== */
try {
  const c = JSON.parse(localStorage.getItem(LSKEY) || 'null');
  DATA = c || JSON.parse(JSON.stringify(SEED));
} catch(e){ DATA = JSON.parse(JSON.stringify(SEED)); }
renderAll();
loadCloud();
</script>
